<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generation Studio</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20260729-2" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/studio" aria-label="Generation Studio 首页">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span>
        <strong>Generation Studio</strong>
        <small>Adobe2API</small>
      </span>
    </a>
    <div class="topbar-actions">
      <span id="accountStatus" class="account-status">正在连接</span>
      <a class="console-link" href="/">管理后台</a>
    </div>
  </header>

  <main class="studio-shell">
    <aside class="control-panel" aria-label="生成参数">
      <section class="control-section">
        <div class="section-heading">
          <h2>生成设置</h2>
          <span id="modelAvailability" class="availability">检查中</span>
        </div>

        <div class="field-group">
          <span class="field-label">生成类型</span>
          <div class="segmented" role="group" aria-label="生成类型">
            <button type="button" class="segment" data-media-type="image">图片</button>
            <button type="button" class="segment active" data-media-type="video">视频</button>
          </div>
        </div>

        <div class="field-group">
          <span class="field-label">模型</span>
          <select id="model" class="model-select" aria-label="生成模型"></select>
        </div>

        <div class="setting-row">
          <label for="resolution">分辨率</label>
          <select id="resolution" class="compact-select" aria-label="视频分辨率"></select>
        </div>

        <div class="setting-row">
          <label for="ratio">画面比例</label>
          <select id="ratio" class="compact-select" aria-label="画面比例"></select>
        </div>

        <div id="qualityRow" class="setting-row" hidden>
          <label for="quality">质量</label>
          <select id="quality" class="compact-select" aria-label="图片质量">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </div>

        <div id="groundSearchRow" class="setting-row" hidden>
          <label for="groundSearch">使用 Google 搜索</label>
          <label class="toggle">
            <input id="groundSearch" type="checkbox" />
            <span class="toggle-track" aria-hidden="true"></span>
          </label>
        </div>

        <div id="durationRow" class="setting-row">
          <label for="duration">时长</label>
          <select id="duration" class="compact-select" aria-label="视频时长"></select>
        </div>

        <div id="fpsRow" class="setting-row locked-row">
          <span class="field-label">帧率</span>
          <strong>24 FPS</strong>
        </div>

        <div id="audioRow" class="setting-row">
          <label for="generateAudio">生成音频</label>
          <label class="toggle">
            <input id="generateAudio" type="checkbox" checked />
            <span class="toggle-track" aria-hidden="true"></span>
          </label>
        </div>
      </section>

      <section class="control-section reference-section">
        <div class="section-heading">
          <h2>参考素材</h2>
          <span id="mediaCount" class="count-badge">0 / 12</span>
        </div>
        <div id="referenceModeGroup" class="field-group" hidden>
          <span class="field-label">参考方式</span>
          <div class="segmented" role="group" aria-label="参考方式">
            <button type="button" class="segment active" data-reference-mode="frame">首尾影格</button>
            <button type="button" class="segment" data-reference-mode="image">参考图片</button>
          </div>
        </div>
        <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="选择参考素材">
          <input id="mediaInput" type="file" multiple hidden accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,audio/mpeg,audio/mp4,audio/wav,audio/x-wav,audio/aac,audio/ogg" />
          <span class="upload-mark" aria-hidden="true">+</span>
          <strong>选择素材</strong>
          <span id="mediaHint">图片、视频或音频</span>
        </div>
        <div id="mediaList" class="media-list" aria-live="polite"></div>
      </section>

      <details id="advancedPanel" class="advanced-panel">
        <summary>高级设置</summary>
        <label for="negativePrompt">负面提示词</label>
        <textarea id="negativePrompt" rows="3" placeholder="不希望出现在视频中的内容"></textarea>
      </details>
    </aside>

    <section class="workspace" aria-label="生成工作区">
      <div class="result-toolbar">
        <div>
          <span class="eyebrow">当前作品</span>
          <h1 id="resultTitle">新视频</h1>
        </div>
        <div class="result-actions">
          <span id="statusBadge" class="status-badge idle">待生成</span>
          <a id="downloadBtn" class="download-btn" href="#" download hidden>下载</a>
        </div>
      </div>

      <div id="resultStage" class="result-stage portrait-stage">
        <div id="emptyState" class="empty-state">
          <span class="empty-play" aria-hidden="true"></span>
          <strong>准备生成</strong>
          <span>设置参数并提交提示词</span>
        </div>
        <video id="resultVideo" controls playsinline hidden></video>
        <img id="resultImage" alt="生成结果" hidden />
      </div>

      <div id="progressPanel" class="progress-panel" hidden>
        <div class="progress-copy">
          <strong id="progressLabel">正在提交</strong>
          <span id="elapsedTime">00:00</span>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <p id="progressDetail">正在准备参考素材</p>
      </div>

      <section class="task-panel" aria-label="生成任务">
        <div class="task-heading">
          <h2>任务队列</h2>
          <div class="task-heading-actions">
            <span id="taskCount">0 个任务</span>
            <button id="clearStoppedTasksBtn" class="task-clear-btn" type="button" disabled>清理已停止</button>
          </div>
        </div>
        <div id="taskList" class="task-list">
          <p class="task-empty">提交后可继续添加任务</p>
        </div>
      </section>

      <div class="composer">
        <label for="prompt">提示词</label>
        <div class="composer-row">
          <textarea id="prompt" rows="3" placeholder="描述你希望生成的视频画面、动作与镜头"></textarea>
          <button id="generateBtn" class="generate-btn" type="button" disabled>
            <span class="generate-icon" aria-hidden="true"></span>
            <span>生成视频</span>
          </button>
        </div>
        <div class="composer-meta">
          <span id="requestSummary">Fast · 4 秒 · 9:16 · 720p</span>
          <span id="formMessage" role="status"></span>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/static/app.js?v=20260729-6"></script>
</body>
</html>
